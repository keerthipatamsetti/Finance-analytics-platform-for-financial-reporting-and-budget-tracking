<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h2>Edit Expense</h2>

<form method="POST">

<label>Category</label>
<input type="text" name="category" class="form-control" value="{{ expense.category }}">

<br>

<label>Amount</label>
<input type="number" name="amount" class="form-control" value="{{ expense.amount }}">

<br>

<label>Date</label>
<input type="date" name="date" class="form-control" value="{{ expense.date }}">

<br>

<label>Description</label>
<input type="text" name="description" class="form-control" value="{{ expense.description }}">

<br>

<button class="btn btn-success">Update</button>

<a href="/expense" class="btn btn-secondary">Cancel</a>

</form>

</body>
</html>
