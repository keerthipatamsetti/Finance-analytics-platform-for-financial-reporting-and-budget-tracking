<!DOCTYPE html>
<html>
<head>
    <title>Expense Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-danger">Expense Management</h2>

<form method="POST">

<div class="mb-3">
<label>Category</label>
<input type="text" name="category" class="form-control" required>
</div>

<div class="mb-3">
<label>Amount</label>
<input type="number" name="amount" class="form-control" required>
</div>

<div class="mb-3">
<label>Date</label>
<input type="date" name="date" class="form-control" required>
</div>

<div class="mb-3">
<label>Description</label>
<textarea name="description" class="form-control"></textarea>
</div>

<button class="btn btn-danger">Add Expense</button>

</form>

<hr>

<h4>Expense List</h4>

<table class="table table-bordered">

<tr>
<th>ID</th>
<th>Category</th>
<th>Amount</th>
<th>Date</th>
<th>Description</th>
<th>Action</th>
</tr>

{% for expense in expenses %}
<tr>
<td>{{ expense.id }}</td>
<td>{{ expense.category }}</td>
<td>₹{{ expense.amount }}</td>
<td>{{ expense.date }}</td>
<td>{{ expense.description }}</td>
<td>
    <a href="/edit_expense/{{ expense.id }}" class="btn btn-warning btn-sm">Edit</a>

    <a href="/delete_expense/{{ expense.id }}" class="btn btn-danger btn-sm">Delete</a>
  
</td>
</tr>
{% endfor %}

</table>

<a href="/dashboard" class="btn btn-primary">Back to Dashboard</a>

</div>

</body>
</html>
