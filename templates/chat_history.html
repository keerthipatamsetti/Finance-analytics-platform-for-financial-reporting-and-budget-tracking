<!DOCTYPE html>

<html>

<head>

<title>Chat History</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2>

Jarvis Chat History

</h2>

<table class="table table-bordered">

<tr>

<th>Date</th>

<th>Question</th>

<th>Answer</th>

</tr>

{% for c in chats %}

<tr>

<td>{{ c.date }}</td>

<td>{{ c.question }}</td>

<td>{{ c.answer }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
