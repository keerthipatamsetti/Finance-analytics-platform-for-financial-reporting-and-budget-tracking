<!DOCTYPE html>
<html>
<head>

<title>Income</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-primary">
Income Management
</h2>

<form method="POST">

<div class="mb-3">

<label>Income Source</label>

<input
type="text"
name="source"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Amount</label>

<input
type="number"
name="amount"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Date</label>

<input
type="date"
name="date"
class="form-control"
required>

</div>

<button class="btn btn-success">
Add Income
</button>

</form>

<hr>

<h4>Income List</h4>

<table class="table table-bordered">

<tr>

<th>ID</th>

<th>Source</th>

<th>Amount</th>

<th>Date</th>

<th>Action</th>

</tr>

{% for income in incomes %}

<tr>
    <td>{{ income.id }}</td>

    <td>{{ income.source }}</td>

    <td>₹{{ income.amount }}</td>

    <td>{{ income.date }}</td>

    <td>
    <a href="/edit_income/{{ income.id }}" class="btn btn-warning btn-sm">Edit</a>

    <a href="/delete_income/{{ income.id }}" class="btn btn-danger btn-sm">Delete</a>    
    </td>
</tr>

{% endfor %}

</table>

<a href="/dashboard" class="btn btn-primary">
Back to Dashboard
</a>

</div>

</body>
</html>
