<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Finance Insights - Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0d6efd,#20c997);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.login-box{
width:430px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.logo{
font-size:45px;
text-align:center;
}

h2{
text-align:center;
color:#0d6efd;
font-weight:bold;
margin-bottom:25px;
}

.form-control{
height:45px;
border-radius:10px;
}

.btn-login{
width:100%;
height:45px;
background:#0d6efd;
color:white;
border:none;
border-radius:10px;
font-size:18px;
}

.btn-login:hover{
background:#0b5ed7;
}

p{
text-align:center;
margin-top:15px;
}

a{
text-decoration:none;
}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">💰</div>

<h2>SMART FINANCE INSIGHTS</h2>

{% if request.args.get('registered') %}
<div class="alert alert-success">
    ✅ Registration Successful! Please login to continue.
</div>
{% endif %}

<form method="POST">

<div class="mb-3">
<label>Email</label>
<input type="email" name="email" class="form-control" required>
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" name="password" class="form-control" required>
</div>

<button class="btn-login">
Login
</button>

</form>

<p>
Don't have an account?
<a href="/register">Register</a>
</p>

</div>

</body>
</html>
