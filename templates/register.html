<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Finance Insights - Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            margin:0;
            padding:0;
            font-family:Arial,sans-serif;
            background:linear-gradient(135deg,#0d6efd,#20c997);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .register-box{
            width:430px;
            background:#fff;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,.2);
        }

        h2{
            text-align:center;
            color:#0d6efd;
            margin-bottom:25px;
            font-weight:bold;
        }

        .form-control{
            height:45px;
            border-radius:10px;
        }

        .btn-register{
            background:#198754;
            color:white;
            width:100%;
            height:45px;
            border:none;
            border-radius:10px;
            font-size:18px;
        }

        .btn-register:hover{
            background:#157347;
        }

        p{
            text-align:center;
            margin-top:15px;
        }

        a{
            text-decoration:none;
        }

        .logo{
            text-align:center;
            font-size:45px;
            margin-bottom:10px;
        }
    </style>
</head>

<body>

<div class="register-box">

<div class="logo">💰</div>

<h2>SMART FINANCE INSIGHTS</h2>

<form method="POST">

<div class="mb-3">
<label class="form-label">Full Name</label>
<input type="text" class="form-control" name="name" required>
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" name="email" required>
</div>

<div class="mb-3">
<label class="form-label">Password</label>
<input type="password" class="form-control" name="password" required>
</div>

<button class="btn-register">Register</button>

</form>

<p>
Already have an account?
<a href="/login">Login</a>
</p>

</div>

</body>
</html>
